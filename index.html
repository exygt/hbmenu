<style>
  :root{
    --sand:#FBF4E6;
    --card:rgba(255,255,255,.55);
    --card-solid:#FFFDF8;
    --glass-brd:rgba(255,255,255,.8);
    --ink:#22313C;
    --ink-soft:rgba(34,49,60,.62);
    --sea:#0F7E7A;
    --sea-deep:#0B5E63;
    --sun:#F2B33D;
    --sun-soft:#FCE9C6;
    --sun-deep:#8F5E06;
    --coral:#E86A4E;
    --wa:#22B45E;
    --red:#D0453B;
    --shadow:0 12px 32px rgba(34,49,60,.10);
    --r-lg:22px;
    --r-md:16px;
    --r-sm:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{
    font-family:'Poppins',Arial,Helvetica,sans-serif;
    background:var(--sand);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;}
  input,select,textarea{
    font-family:inherit;font-size:16px;width:100%;
    padding:13px 14px;border:1.5px solid rgba(34,49,60,.18);
    background:rgba(255,255,255,.65);color:var(--ink);outline:none;
    border-radius:var(--r-sm);transition:border-color .2s, box-shadow .2s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(15,126,122,.12);}
  textarea{resize:vertical;}
  .wrap{max-width:30rem;margin:0 auto;position:relative;z-index:1;}
  .glass{
    background:var(--card);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-brd);
    box-shadow:var(--shadow);
  }

  /* ---------- particles ---------- */
  .particles{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .p{position:absolute;border-radius:50%;filter:blur(55px);animation:drift 16s ease-in-out infinite;}
  .p1{width:260px;height:260px;background:rgba(15,126,122,.16);top:-70px;left:-80px;}
  .p2{width:200px;height:200px;background:rgba(242,179,61,.22);top:12%;right:-70px;animation-delay:-3s;animation-duration:19s;}
  .p3{width:170px;height:170px;background:rgba(232,106,78,.13);top:38%;left:-60px;animation-delay:-7s;}
  .p4{width:220px;height:220px;background:rgba(242,179,61,.16);top:58%;right:-60px;animation-delay:-5s;animation-duration:21s;}
  .p5{width:180px;height:180px;background:rgba(15,126,122,.13);bottom:6%;left:-50px;animation-delay:-9s;animation-duration:17s;}
  .p6{width:150px;height:150px;background:rgba(232,106,78,.12);bottom:-40px;right:14%;animation-delay:-11s;}
  @keyframes drift{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(26px,-38px);}
  }

  /* ---------- language select ---------- */
  .lang-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22px;position:relative;z-index:1;}
  .lang-card{width:100%;max-width:24rem;border-radius:var(--r-lg);padding:38px 28px 30px;text-align:center;animation:fadeUp .6s ease both;}
  .brand-mini{font-size:12px;font-weight:600;letter-spacing:.42em;color:var(--sea);margin-bottom:14px;}
  .sun-bar{width:46px;height:5px;border-radius:99px;background:var(--sun);margin:0 auto 22px;}
  .lang-card h1{font-size:24px;font-weight:600;letter-spacing:.06em;}
  .lang-card .sub{font-size:13px;color:var(--ink-soft);margin-top:5px;margin-bottom:30px;}
  .lang-btn{
    display:block;width:100%;padding:17px;font-size:16px;font-weight:600;
    letter-spacing:.18em;border-radius:999px;margin-bottom:13px;
    transition:transform .15s, box-shadow .2s, background .2s;
  }
  .lang-btn:active{transform:scale(.98);}
  .lang-btn.solid{background:var(--sea);color:#fff;box-shadow:0 10px 24px rgba(15,126,122,.30);}
  .lang-btn.solid:hover{background:var(--sea-deep);}
  .lang-btn.outline{border:1.5px solid rgba(34,49,60,.28);background:rgba(255,255,255,.55);}
  .lang-btn.outline:hover{border-color:var(--sea);color:var(--sea);}
  .est{margin-top:22px;font-size:10px;letter-spacing:.32em;color:var(--ink-soft);}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(251,244,230,.72);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.8);
    box-shadow:0 6px 24px rgba(34,49,60,.06);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;}
  .tagline{font-size:9.5px;font-weight:600;letter-spacing:.42em;color:var(--sea);}
  .brand{font-size:19px;font-weight:700;letter-spacing:.14em;}
  .lang-toggle{
    padding:9px 16px;border-radius:999px;font-size:12px;font-weight:600;
    letter-spacing:.14em;background:var(--sun-soft);color:var(--sun-deep);
    border:1px solid rgba(242,179,61,.5);transition:transform .15s;
  }
  .lang-toggle:active{transform:scale(.95);}
  .cat-nav{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 13px;scrollbar-width:none;}
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;padding:8px 17px;border-radius:999px;
    font-size:12px;font-weight:500;letter-spacing:.06em;
    background:rgba(255,255,255,.6);border:1px solid rgba(34,49,60,.14);
    transition:background .2s,color .2s,transform .15s;
  }
  .cat-chip:active{transform:scale(.95);}
  .cat-chip:hover{background:var(--sea);color:#fff;border-color:var(--sea);}

  /* ---------- menu ---------- */
  main{padding:6px 18px 140px;}
  .cat-head{display:flex;align-items:center;gap:11px;margin:30px 2px 13px;scroll-margin-top:128px;}
  .cat-dot{width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px rgba(242,179,61,.22);flex-shrink:0;}
  .cat-head h2{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;}
  .cat-line{flex:1;border-top:1.5px dashed rgba(34,49,60,.25);}
  .section{animation:fadeUp .55s ease both;}
  .item-card{
    border-radius:var(--r-md);padding:15px 17px 14px;margin-bottom:11px;
    transition:transform .18s, box-shadow .25s;
  }
  .item-card:active{transform:scale(.985);}
  .item-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;}
  .item-name{font-size:15.5px;font-weight:600;letter-spacing:.01em;}
  .price-pill{
    flex-shrink:0;padding:4px 13px;border-radius:999px;
    background:var(--sun-soft);color:var(--sun-deep);
    font-size:14px;font-weight:600;border:1px solid rgba(242,179,61,.45);
  }
  .item-ing{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-top:5px;}
  .item-img-wrap{width:64px;height:64px;border-radius:var(--r-sm);flex-shrink:0;overflow:hidden;background:rgba(34,49,60,.06);}
  .item-img{width:100%;height:100%;object-fit:cover;display:block;}
  .menu-footer{margin-top:44px;text-align:center;font-size:10px;letter-spacing:.3em;color:var(--ink-soft);}
  .menu-footer a{display:inline-block;margin-top:13px;text-decoration:underline;font-size:11px;letter-spacing:.14em;}
  .center-msg{text-align:center;padding:64px 0;letter-spacing:.08em;color:var(--ink-soft);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- popup ---------- */
  .popup-overlay{position:fixed;inset:0;z-index:100;background:rgba(34,49,60,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s ease both;}
  .popup-box{position:relative;width:100%;max-width:22rem;background:var(--card-solid);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);animation:sheetUp .35s cubic-bezier(.22,1,.36,1) both;}
  .popup-close{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:none;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .15s;}
  .popup-close:active{transform:scale(.95);}
  .popup-img{width:100%;height:auto;display:block;}
  .popup-title{padding:18px 20px 0;font-size:17px;font-weight:700;letter-spacing:.04em;color:var(--ink);}
  .popup-sub{padding:8px 20px 18px;font-size:13px;color:var(--ink-soft);line-height:1.5;}

  /* ---------- whatsapp float ---------- */
  .wa-float{
    position:fixed;left:0;right:0;bottom:18px;z-index:50;
    display:flex;justify-content:center;padding:0 18px;
    transform:translateY(150%);opacity:0;
    transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .45s;
    pointer-events:none;
  }
  .wa-float.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  .wa-btn{
    position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:26rem;padding:16px 24px;border-radius:999px;
    background:var(--wa);color:#fff;text-decoration:none;
    font-size:14px;font-weight:600;letter-spacing:.14em;
    box-shadow:0 14px 34px rgba(34,180,94,.38);
    transition:transform .15s;
  }
  .wa-btn:active{transform:scale(.98);}
  .wa-btn::before{
    content:"";position:absolute;inset:-5px;border-radius:999px;
    border:2.5px solid rgba(34,180,94,.55);
    animation:waping 2.1s ease-out infinite;pointer-events:none;
  }
  @keyframes waping{
    0%{transform:scale(.92);opacity:.9;}
    70%{transform:scale(1.13);opacity:0;}
    100%{transform:scale(1.13);opacity:0;}
  }
  .wa-btn svg{width:21px;height:21px;fill:currentColor;flex-shrink:0;}

  /* ---------- admin ---------- */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0 22px;position:relative;z-index:1;}
  .login-box{width:100%;max-width:24rem;border-radius:var(--r-lg);padding:30px 26px;animation:fadeUp .6s ease both;}
  .login-box h1{font-size:19px;font-weight:700;letter-spacing:.12em;margin-bottom:22px;}
  .field-label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.12em;margin:15px 0 6px;text-transform:uppercase;color:var(--ink-soft);}
  .field-label:first-of-type{margin-top:0;}
  .btn-block{
    display:block;width:100%;padding:15px;font-size:14px;font-weight:600;
    letter-spacing:.14em;text-align:center;text-decoration:none;border-radius:999px;
    transition:transform .15s, box-shadow .2s, background .2s;
  }
  .btn-block:active{transform:scale(.98);}
  .btn-sea{background:var(--sea);color:#fff;box-shadow:0 10px 24px rgba(15,126,122,.28);}
  .btn-sea:hover{background:var(--sea-deep);}
  .btn-ink{background:var(--ink);color:#fff;}
  .btn-outline{border:1.5px solid rgba(34,49,60,.28);background:rgba(255,255,255,.5);}
  .btn-danger-outline{border:1.5px solid var(--red);color:var(--red);background:rgba(255,255,255,.5);}
  .error-msg{margin-top:12px;font-size:13px;font-weight:500;color:var(--red);}
  .back-link{display:block;text-align:center;margin-top:15px;font-size:12px;letter-spacing:.1em;text-decoration:underline;color:var(--ink-soft);}
  .admin-page{position:relative;z-index:1;padding:0 18px 70px;}
  .admin-head{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;}
  .admin-head h1{font-size:16px;font-weight:700;letter-spacing:.14em;}
  .admin-head-btns{display:flex;gap:8px;}
  .admin-head-btns a,.admin-head-btns button{
    padding:9px 15px;border-radius:999px;font-size:11.5px;font-weight:600;
    letter-spacing:.1em;background:rgba(255,255,255,.6);
    border:1px solid rgba(34,49,60,.16);text-decoration:none;
    display:flex;align-items:center;transition:transform .15s;
  }
  .admin-head-btns a:active,.admin-head-btns button:active{transform:scale(.95);}
  .admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab{
    flex-shrink:0;padding:8px 17px;border-radius:999px;font-size:12px;font-weight:500;
    background:rgba(255,255,255,.6);border:1px solid rgba(34,49,60,.14);
    transition:background .2s,color .2s;
  }
  .admin-tab.active{background:var(--sea);color:#fff;border-color:var(--sea);}
  .admin-item{border-radius:var(--r-md);padding:15px 17px;margin-bottom:11px;}
  .admin-item-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .admin-item-name{font-weight:600;font-size:15px;}
  .admin-item-en{font-size:12.5px;color:var(--ink-soft);}
  .admin-item-btns{display:flex;gap:9px;margin-top:12px;}
  .admin-item-btns button{
    flex:1;padding:9px;border-radius:999px;font-size:11.5px;font-weight:600;
    letter-spacing:.12em;border:1.5px solid rgba(34,49,60,.25);
    transition:transform .15s;
  }
  .admin-item-btns button:active{transform:scale(.96);}
  .admin-item-btns .del-btn{border-color:var(--red);color:var(--red);}
  .admin-item-btns .mv{flex:0 0 46px;padding:9px 0;font-size:15px;line-height:1;background:var(--sun-soft);border-color:rgba(242,179,61,.5);color:var(--sun-deep);}
  .form-card{border-radius:var(--r-lg);padding:24px 22px;}
  .form-card h3{font-size:16px;font-weight:700;letter-spacing:.1em;margin-bottom:16px;}
  .form-btns{display:flex;gap:11px;margin-top:22px;}
  .form-btns button{flex:1;padding:13px;font-size:13px;font-weight:600;letter-spacing:.12em;border-radius:999px;}
  .admin-note{
    margin-top:16px;padding:14px 16px;border-radius:var(--r-md);
    background:var(--sun-soft);border:1px solid rgba(242,179,61,.45);
    font-size:12.5px;line-height:1.65;color:var(--sun-deep);
  }
  .publish-bar{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}

  /* ---------- overlay / modal (admin form) ---------- */
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(34,49,60,.45);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .25s ease both;
  }
  @media(min-width:640px){.overlay{align-items:center;padding:0 20px;}}
  .overlay .sheet{
    width:100%;max-width:28rem;max-height:92vh;overflow-y:auto;
    background:var(--card-solid);border-radius:26px 26px 0 0;
    box-shadow:0 -10px 50px rgba(34,49,60,.25);
    animation:sheetUp .35s cubic-bezier(.22,1,.36,1) both;
  }
  @media(min-width:640px){.overlay .sheet{border-radius:26px;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes sheetUp{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
</style>
</head>

const app = document.getElementById("app");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtPrice(p) {
  let s = String(p).trim().replace(",", ".");
  if (/^\d+\.00$/.test(s)) s = s.slice(0, -3);
  return "₺" + s;
}

function getLang() {
  const l = localStorage.getItem(LANG_KEY);
  return l === "tr" || l === "en" ? l : null;
}

function getMenu() {
  try {
    const saved = localStorage.getItem(MENU_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.items)) return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(MENU_DATA));
}

function saveMenu(menu) {
  localStorage.setItem(MENU_KEY, JSON.stringify(menu));
}

function groupedItems(menu, lang) {
  return menu.categories
    .map(cat => ({
      cat,
      label: (menu.labels[cat] && menu.labels[cat][lang]) || cat,
      items: menu.items.filter(i => i.cat === cat)
    }))
    .filter(g => g.items.length > 0);
}

          "<h2>" + esc(g.label) + "</h2>" +
          '<div class="cat-line"></div>' +
        "</section>" +
        rows +
      "</div>";
  });

  if (groups.length === 0) {
    sections = '<p class="center-msg">' + esc(t.empty) + "</p>";
  }

  app.innerHTML =
    "<header>" +
      '<div class="wrap">' +
        '<div class="header-row">' +

      "</div>" +
    "</header>" +
    '<main class="wrap">' +
      sections +
      '<footer class="menu-footer">' +
        "<div>HOUSE BEACH — " + esc(t.menu) + "</div>" +
        '<a href="#admin">' + esc(t.admin) + "</a>" +
      "</footer>" +
    "</main>" +

      '<a class="wa-btn" href="' + WHATSAPP_URL + '" target="_blank" rel="noopener noreferrer">' +
        waSVG() + "<span>" + esc(t.order) + "</span>" +
      "</a>" +
    "</div>";

  document.getElementById("langToggle").addEventListener("click", () => {
    localStorage.removeItem(LANG_KEY);
    render();
  });

  app.querySelectorAll(".cat-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const el = document.getElementById(chip.dataset.target);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

  // WhatsApp butonu
  const waFloat = document.getElementById("waFloat");
  const onScroll = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const ratio = max > 0 ? window.scrollY / max : 0;
    waFloat.classList.toggle("show", ratio > 0.27);
  };
  onScroll();
  window.addEventListener("scroll", onScroll, { passive: true });

  // Pop-up
  const popup = menu.popup;
  if (popup && popup.enabled && popup.image && !sessionStorage.getItem("hb-popup-seen")) {
    const overlay = document.createElement("div");
    overlay.className = "popup-overlay";
    overlay.id = "popupOverlay";
    overlay.innerHTML =
      '<div class="popup-box">' +
        '<button class="popup-close" onclick="closePopup()">&times;</button>' +
        (popup.title ? '<h3 class="popup-title">' + esc(popup.title) + "</h3>" : "") +
        '<img src="' + esc(popup.image) + '" class="popup-img" alt="" onerror="this.style.display=\'none\'">' +
        (popup.subtitle ? '<p class="popup-sub">' + esc(popup.subtitle) + "</p>" : "") +
      "</div>";
    document.body.appendChild(overlay);
  }
}

    btn.addEventListener("click", () => {
      const cat = btn.dataset.catDel;
      if (menu.categories.length <= 1) { alert("Son kategori silinemez."); return; }
      if (window.confirm('"' + menu.labels[cat].tr + '" kategorisi silinsin mi?')) {
        menu.categories = menu.categories.filter(c => c !== cat);
        delete menu.labels[cat];
        menu.items = menu.items.filter(i => i.cat !== cat);
        if (adminCat === cat) adminCat = menu.categories[0];
        saveMenu(menu);
        renderAdminCategories(menu, container);
      }
    });
  });
}

function moveCategory(menu, cat, dir) {
  const idx = menu.categories.indexOf(cat);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= menu.categories.length) return;
  const temp = menu.categories[idx];
  menu.categories[idx] = menu.categories[newIdx];
  menu.categories[newIdx] = temp;
}

function slugify(s) {
  const map = { "ç": "c", "ğ": "g", "ı": "i", "ö": "o", "ş": "s", "ü": "u",
                "Ç": "c", "Ğ": "g", "İ": "i", "I": "i", "Ö": "o", "Ş": "s", "Ü": "u" };
  return String(s).split("").map(c => map[c] || c).join("")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function moveItem(menu, id, dir) {
  const arr = menu.items;
  const i = arr.findIndex(x => x.id === id);
  if (i < 0) return;
  const cat = arr[i].cat;
  let j = i + dir;
  while (j >= 0 && j < arr.length && arr[j].cat !== cat) j += dir;
  if (j < 0 || j >= arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}

function openCatForm(menu) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML =
    '<form class="sheet" id="catForm">' +
      '<div class="form-card">' +
        "<h3>YENİ KATEGORİ</h3>" +
        '<label class="field-label" for="cTr">Kategori Adı (Türkçe)</label>' +
        '<input id="cTr" required placeholder="örn: Tatlılar">' +
        '<label class="field-label" for="cEn">Kategori Adı (İngilizce)</label>' +
        '<input id="cEn" required placeholder="örn: Desserts">' +
        '<div class="form-btns">' +
          '<button type="button" class="btn-outline" id="catCancel">VAZGEÇ</button>' +
          '<button type="submit" class="btn-sea">EKLE</button>' +
        "</div>" +
      "</div>" +
    "</form>";

  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#catCancel").addEventListener("click", () => overlay.remove());

  overlay.querySelector("#catForm").addEventListener("submit", e => {
    e.preventDefault();
    const tr = overlay.querySelector("#cTr").value.trim();
    const en = overlay.querySelector("#cEn").value.trim();
    if (!tr || !en) return;
    const base = slugify(tr) || "kategori";
    let slug = base, n = 2;
    while (menu.categories.indexOf(slug) !== -1) { slug = base + "-" + n; n++; }
    menu.categories.push(slug);
    menu.labels[slug] = { tr: tr, en: en };
    saveMenu(menu);
    adminCat = slug;
    overlay.remove();
    renderAdmin();
  });

  document.body.appendChild(overlay);
  overlay.querySelector("#cTr").focus();
}

function openForm(item, menu) {
  const editing = !!item;
  const v = item || { cat: adminCat, tr: "", en: "", price: "", itr: "", ien: "", img: "" };

  let options = "";
  menu.categories.forEach(c => {
    options +=
      '<option value="' + esc(c) + '"' + (c === v.cat ? " selected" : "") + ">" +
      esc(menu.labels[c].tr) + "</option>";
  });

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML =
    '<form class="sheet" id="itemForm">' +
      '<div class="form-card">' +
        "<h3>" + (editing ? "ÜRÜNÜ DÜZENLE" : "YENİ ÜRÜN") + "</h3>" +
        '<label class="field-label">Bölüm</label>' +
        '<select id="fCat">' + options + "</select>" +
        '<label class="field-label">Ürün Adı (Türkçe)</label>' +
        '<input id="fTr" required value="' + esc(v.tr) + '">' +
        '<label class="field-label">Ürün Adı (İngilizce)</label>' +
        '<input id="fEn" required value="' + esc(v.en) + '">' +
        '<label class="field-label">Fiyat (₺)</label>' +
        '<input id="fPrice" required inputmode="decimal" placeholder="örn: 250" value="' + esc(String(v.price).replace(/\.00$/, "")) + '">' +
        '<label class="field-label">Görsel URL (isteğe bağlı)</label>' +
        '<input id="fImg" value="' + esc(v.img || "") + '" placeholder="https://ornek.com/yemek.jpg">' +
        '<p class="hint">⚠️ Görselin doğrudan internet linki olmalı. Instagram, WhatsApp veya bilgisayar klasöründen kopyalanan linkler çalışmaz. Imgur, Cloudinary gibi sitelerden yükleyebilirsin.</p>' +
        '<label class="field-label">İçindekiler (Türkçe)</label>' +
        '<textarea id="fItr" rows="3">' + esc(v.itr) + "</textarea>" +
        '<label class="field-label">İçindekiler (İngilizce)</label>' +
        '<textarea id="fIen" rows="3">' + esc(v.ien) + "</textarea>" +
        '<p class="error-msg" id="formErr" style="display:none"></p>' +
        '<div class="form-btns">' +
          '<button type="button" class="btn-outline" id="cancelBtn">VAZGEÇ</button>' +
          '<button type="submit" class="btn-sea">KAYDET</button>' +
        "</div>" +
      "</div>" +
    "</form>";

  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#cancelBtn").addEventListener("click", () => overlay.remove());

  overlay.querySelector("#itemForm").addEventListener("submit", e => {
    e.preventDefault();
    const price = overlay.querySelector("#fPrice").value.trim().replace(",", ".");
    if (!/^\d+(\.\d{1,2})?$/.test(price)) {
      const err = overlay.querySelector("#formErr");
      err.textContent = "Fiyat geçersiz (örn: 250 veya 250.50)";
      err.style.display = "block";
      return;
    }
    const data = {
      cat: overlay.querySelector("#fCat").value,
      tr: overlay.querySelector("#fTr").value.trim(),
      en: overlay.querySelector("#fEn").value.trim(),
      price: price,
      img: overlay.querySelector("#fImg").value.trim(),
      itr: overlay.querySelector("#fItr").value.trim(),
      ien: overlay.querySelector("#fIen").value.trim()
    };
    if (editing) {
      Object.assign(item, data);
    } else {
      data.id = Date.now();
      menu.items.push(data);
      adminCat = data.cat;
    }
    saveMenu(menu);
    overlay.remove();
    renderAdmin();
  });

  document.body.appendChild(overlay);
}

/* ================= YAYINLA (index.html indir) ================= */
async function exportHTML() {
  try {
    const res = await fetch(location.href.split("#")[0], { cache: "no-store" });
    let src = await res.text();
    const block =
      "/*MENU_DATA_START*/\nconst MENU_DATA = " +
      JSON.stringify(getMenu(), null, 2) +
      ";\n/*MENU_DATA_END*/";
    src = src.replace(/\/\*MENU_DATA_START\*\/[\s\S]*?\/\*MENU_DATA_END\*\//, block);
    const blob = new Blob([src], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    alert("Güncel index.html indirildi.\n\nŞimdi GitHub'daki repo'na gir → Add file → Upload files → bu dosyayı yükle. Site birkaç saniyede kendini günceller.");
  } catch (e) {
    alert("Dosya oluşturulamadı. Bu özellik site internette yayınlanmışken çalışır.");
  }
}

function render() {
  window.scrollTo(0, 0);
  if (location.hash === "#admin") {

    else renderAdminLogin();

  }
  const lang = getLang();

}

window.addEventListener("hashchange", render);
render();
